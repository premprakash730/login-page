<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>please fill out form</p>

    <br>
    <form>

        <h2>Personal Detail</h2>

        <label for="First Name">First Name</label>
        <input type="text" First Name="userFirst Name"id="First Name" placeholder="e.g:shubham">

        <br><br>

        <label for="Last Name">Last Name</label>
        <input type="text"Last Name="userLast Name"id="Last Name" placeholder="e.g:kushwaha">


        <br><br>

        <label for="Date Of Birth">Date Of Birth</label>
        <input type="date" name="userDate Of Birth"id="Date Of Birth" placeholder="e.g:dd/mm/yy">

        <br><br>
        <h4>Gender</h4>
        <label for="male">Male</label>
           <input type="radio"name="gender" id="male"value="Male">

           <br><br>


           <label for="Female">Female</label>
           <input type="radio"name="gender" id="Female""value="Female">

           <br><br>


           <label for="Other">Other</label>
           <input type="radio"name="gender" id="Other""value="Other">


           <br><br>
           <h4>Upload your Photo</h4> 
           <input type="file"name="file">



           <hr>



           <h2>Contact Information</h2>

           <label for="email ">Email address</label>
           <input type="email"name="email"id="email">

           <br><br>
           <label for="phone ">Phone number</label>
           <input type="tel"name="phone"id="phone">

           <br><br>
           <label for="Address">Mailling Address</label>
           <br>
           <textarea name="Address"id="Address" rows="10" cols="30"></textarea>


           <hr>


           <h2>Academic Information</h2>

           <label for="course">Select Your Course:</label>
           <select name="course"id="course">
            <option value="CSE">CSE</option>
            <option value="ME">ME</option>
            <option value="IT">It</option>
           </select>

           <br><br>

           <h3>Extracurricular Activities</h3>


           <label for="sport">Sports</label>
           <input type="checkbox"name="intersest"id="Sports"value="Sports">
           <br><br>

            <label for="Music">Music</label>
           <input type="checkbox" name="interest"id="Music"value="music">
           <br><br>




            <label for="Technology">Technology</label>
           <input type="checkbox" name="interset"id="Technology"value="Technology">
           <br><br>



            



    </form>
</body>
</html>
